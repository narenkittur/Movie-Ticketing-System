spring.application.name=movieticket

# --- Database (MySQL) ---
# spring-boot-starter-data-jpa is on the classpath, so Spring Boot WILL try to
# auto-configure a DataSource at startup - without these properties the app fails
# to boot at all (no embedded DB is on the classpath to fall back to). Override
# every value below via the matching environment variable in any real deployment;
# the inline defaults are for local development only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movieticket}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# "update" auto-adds new tables/columns (e.g. refresh_tokens) without dropping
# existing data - convenient in dev, but a real migration tool (Flyway/Liquibase)
# should replace this before production per claude.md's constraints.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# --- Redis (Module 4 seat locking) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# ⚠️ Lettuce's default command timeout is 60 SECONDS - a hung (not even dead)
# Redis would otherwise block every request thread, including endpoints that
# never touch Redis, long before any client sees a 503. This one property is
# what makes every "fail fast" claim in claude.md actually true rather than
# aspirational (plan/redis.md section 9-A) - do not remove it.
spring.data.redis.timeout=${REDIS_TIMEOUT:1000ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1000ms}

# Seat lock TTL (plan/redis.md section 3). claude.md fixes this at 300s; this
# property exists so a deployment can tune it without a recompile, NOT as an
# invitation to change it casually - update claude.md too if it ever changes.
seatlock.ttl-seconds=${SEAT_LOCK_TTL_SECONDS:300}

# --- JWT (Module 2 — Authentication) ---
# jwt.secret MUST be overridden via the JWT_SECRET environment variable in any
# real deployment - never rely on this default outside local dev. It is a
# randomly generated, Base64-encoded 256-bit key, long enough for HS256 signing
# (see JwtService#signingKey). Rotating it invalidates every previously issued
# access token immediately (refresh tokens are unaffected - they're opaque and
# DB-checked, not signed by this key).
jwt.secret=${JWT_SECRET:MVynaSNpUoMB5ZFtE63tgPiBTJcrF6A30gwnIfJ2V+Q=}
# 30 minutes, in milliseconds - short-lived by design (see Issue #2 in
# plan/authentication.md: a stolen access token can't be revoked before expiry,
# so the exposure window is kept small instead).
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:1800000}
# 7 days, in milliseconds - long-lived, but DB-backed and revocable (see RefreshToken).
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- Payment gateway (Module 5, plan/payment.md section 9) ---
# "mock" (default, offline, no credentials) or "razorpay" (real TEST-mode
# gateway - see RazorpayPaymentGateway's javadoc for why "real" costs nothing).
# Exactly one of MockPaymentGateway/RazorpayPaymentGateway is ever on the
# context, selected via @ConditionalOnProperty on those classes themselves.
payment.gateway=${PAYMENT_GATEWAY:mock}
payment.currency=${PAYMENT_CURRENCY:INR}
# Base URL this app is reachable at - used to build the mock checkout link and
# the Razorpay callback_url. For a real Razorpay test against localhost, point
# this at a tunnel (README.md's runbook: cloudflared, not ngrok).
payment.callback-base-url=${PAYMENT_CALLBACK_BASE_URL:http://localhost:8080}
payment.razorpay.api-base-url=${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
# ⚠️ No inline default for any of these three, on purpose (plan/payment.md
# section 8.6, same spirit as jwt.secret's standing warning above) - there is
# no safe local placeholder for a credential. RazorpayPaymentGateway refuses to
# start if payment.gateway=razorpay and any of these is blank.
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --- WebSockets (Module 6, plan/websockets.md) ---
# CORS on the STOMP handshake (WebSocketConfig#registerStompEndpoints) - comma-
# separated origin patterns. Module 8's frontend is the real consumer; the
# localhost default covers local dev against any port.
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:*}
# Gates SeatLockExpiryListener + RedisConfig's RedisMessageListenerContainer
# (plan/websockets.md section 5.1/Open Decision E). true assumes the
# docker-compose.yml Redis, which runs with --notify-keyspace-events Kx; turn this
# off against a managed Redis that doesn't have keyspace notifications enabled -
# the client-side countdown (section 5.2) is the correctness floor either way, so
# turning this off only makes seat-freed updates late, never wrong.
websocket.expiry-notifications.enabled=${WEBSOCKET_EXPIRY_NOTIFICATIONS_ENABLED:true}

# --- QR tickets (Module 7, plan/qrtickets.md) ---
# How early before showtime the gate accepts a ticket. The window closes at
# startTime + movie.durationMinutes, derived not persisted (section 5.3).
ticket.checkin.opens-minutes-before=${TICKET_CHECKIN_OPENS_MINUTES_BEFORE:60}
